[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-mesh-core"
version = "0.1.0"
description = "Local-disk coordinator core for AgentMesh"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
agent-mesh-bootstrap = "agent_mesh_core.bootstrap:main"
agent-mesh-recover-processing = "agent_mesh_core.inbox:recover_main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_mesh_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
